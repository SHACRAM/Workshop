<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - News Anti-IA</title>
  <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    <form id="login-form">
      <input type="text" name="username" placeholder="Utilisateur" required>
      <input type="password" name="password" placeholder="Mot de passe" required>
      <button type="submit">Connexion au site secret</button>
      <div id="login-error"></div>
    </form>
  </div>

  <script>
    const USERS = [
      { username: "admin", password: "1234" },
      { username: "test", password: "abcd" }
    ];

    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
      const u = this.username.value;
      const p = this.password.value;
      const user = USERS.find(user => user.username === u && user.password === p);
      if(user){
        window.location.href = 'news.html';
      } else {
        document.getElementById('login-error').textContent = "Identifiants incorrects";
      }
    });
  </script>
</body>
</html>
